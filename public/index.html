<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheapest Pizza AI</title>
    <link href="styles.css" rel="stylesheet">
  </head>
  <body>
    <h1>Cheapest <span>Pizza</span> AI</h1>
    <p class="subtitle">Find the best pizza deals near you, powered by AI.</p>

    <div class="search-card">
      <div class="field">
        <label for="location">Location</label>
        <input id="location" type="text" placeholder="e.g. Brooklyn, NY or 90210">
      </div>
      <div class="field">
        <label for="radius">Radius (miles)</label>
        <input id="radius" type="number" placeholder="e.g. 5" min="1" max="50">
      </div>
      <button type="button" id="search-btn" onclick="searchPizza()">Find Cheapest Pizza</button>
    </div>

    <!-- Cat GIF loader -->
    <div id="gif-loader">
      <div id="gif-container">
        <div class="gif-slide active">
          <iframe src="https://tenor.com/embed/3585895304272773690" title="Cat making pizza" loading="lazy"></iframe>
        </div>
        <div class="gif-slide">
          <iframe src="https://tenor.com/embed/15352601151133641343" title="Cat eating pizza" loading="lazy"></iframe>
        </div>
        <div class="gif-slide">
          <iframe src="https://tenor.com/embed/4480725" title="Cheese pizza cat" loading="lazy"></iframe>
        </div>
        <div class="gif-slide">
          <iframe src="https://tenor.com/embed/22351867" title="Cat begging for pizza" loading="lazy"></iframe>
        </div>
        <div class="gif-slide">
          <iframe src="https://tenor.com/embed/27045411" title="Pizza cat" loading="lazy"></iframe>
        </div>
        <div class="gif-slide">
          <iframe src="https://tenor.com/embed/4543991" title="Super pizza cat" loading="lazy"></iframe>
        </div>
      </div>
      <p id="gif-caption">Consulting the pizza cats...</p>
    </div>

    <div id="results"></div>

    <script>
      // ── Cat GIF loader ──
      const CAPTIONS = [
        "Consulting the pizza cats...",
        "Sniffing out the best deals...",
        "Calculating cheese-to-price ratios...",
        "The cats demand pepperoni...",
        "Interrogating local delivery drivers...",
        "Almost there, whiskers on the case...",
      ];

      let gifIndex = 0;
      let gifTimer = null;
      const slides = document.querySelectorAll(".gif-slide");

      function startGifs() {
        gifIndex = 0;
        setGifSlide(0);
        document.getElementById("gif-loader").classList.add("active");
        gifTimer = setInterval(() => {
          gifIndex = (gifIndex + 1) % slides.length;
          setGifSlide(gifIndex);
        }, 2500);
      }

      function stopGifs() {
        clearInterval(gifTimer);
        gifTimer = null;
        document.getElementById("gif-loader").classList.remove("active");
      }

      function setGifSlide(idx) {
        slides.forEach((el, i) => el.classList.toggle("active", i === idx));
        const caption = document.getElementById("gif-caption");
        caption.style.opacity = "0";
        setTimeout(() => {
          caption.textContent = CAPTIONS[idx];
          caption.style.opacity = "1";
        }, 150);
      }

      // ── Order link with Text Fragment for auto-highlighting ──
      function openOrder(url, item) {
        try {
          const u = new URL(url);
          u.hash = ":~:text=" + encodeURIComponent(item.slice(0, 50));
          window.open(u.toString(), "_blank", "noopener,noreferrer");
        } catch {
          window.open(url, "_blank", "noopener,noreferrer");
        }
      }

      // ── Search ──
      async function searchPizza() {
        const location = document.getElementById("location").value.trim();
        const radius = document.getElementById("radius").value.trim();
        const resultsEl = document.getElementById("results");
        const btn = document.getElementById("search-btn");

        if (!location || !radius) {
          resultsEl.innerHTML = '<p class="error">Please enter a location and radius.</p>';
          return;
        }

        btn.disabled = true;
        btn.textContent = "Searching...";
        resultsEl.innerHTML = "";
        startGifs();

        try {
          const res = await fetch("/api/pizza/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ location, radius: Number(radius) }),
          });

          const data = await res.json();

          if (!res.ok) {
            resultsEl.innerHTML = `<p class="error">${data.error || "Something went wrong."}</p>`;
            return;
          }

          if (!data.results || data.results.length === 0) {
            resultsEl.innerHTML = '<p class="error">No results found. Try a different location.</p>';
            return;
          }

          const cards = data.results.map((r, i) => ({
            html: `
              <div class="result-card">
                <h3>${r.name}</h3>
                <p class="address">${r.address}</p>
                <div class="deal-row">
                  <span class="item">${r.cheapestItem}</span>
                  <span class="price">${r.price}</span>
                </div>
                <p class="note">${r.note}</p>
                ${r.orderUrl ? `<button type="button" class="order-btn" id="order-btn-${i}">
                  Order Now
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                    <path d="M2 11L11 2M11 2H5M11 2V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>` : ""}
              </div>`,
            r, i
          }));

          resultsEl.innerHTML = cards.map(c => c.html).join("");

          cards.forEach(({ r, i }) => {
            if (!r.orderUrl) return;
            document.getElementById(`order-btn-${i}`).addEventListener("click", () => {
              openOrder(r.orderUrl, r.cheapestItem);
            });
          });

        } catch {
          resultsEl.innerHTML = '<p class="error">Failed to connect to server.</p>';
        } finally {
          stopGifs();
          btn.disabled = false;
          btn.textContent = "Find Cheapest Pizza";
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Enter") searchPizza();
      });
    </script>
  </body>
</html>
